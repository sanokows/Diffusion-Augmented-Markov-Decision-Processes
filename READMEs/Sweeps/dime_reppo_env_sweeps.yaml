name: dime-reppo-acrobot
method: grid

parameters:
  env_name:
    values: [AcrobotSwingup, BallInCup, AcrobotSwingupSparse, PendulumSwingup]
  num_eval:
    values: [50]
  total_time_steps:
    values: [50000000]
  diff_steps:
    values: [8]
  kl_action_rep:
    values: [4]
  reverse_kl:
    values: [false]
  actor_kl_clip_mode:
    values: [clipped]
  ent_start:
    values: [0.01]
  vmin:
    values: [-30]
  vmax:
    values: [170]
  num_bins:
    values: [201]
  learn_friction:
    values: [true]
  learn_dt:
    values: [true]
  per_step_dt:
    values: [true]
  lr:
    values: [3e-4]
  config_env:
    values: [mjx_dmc]
  exp_overrides:
    values: [mjx_dmc_large_data]
  wandb_project_suffix:
    values: ["_Final_reppo_DIME"]
  n_trials:
    values: [3]

command:
  - python
  - -m
  - src.jaxrl.reppo_dime
  - env.name=${env_name}
  - hyperparameters.num_eval=${num_eval}
  - hyperparameters.total_time_steps=${total_time_steps}
  - hyperparameters.diffusion.diff_steps=${diff_steps}
  - hyperparameters.kl_action_rep=${kl_action_rep}
  - hyperparameters.reverse_kl=${reverse_kl}
  - hyperparameters.actor_kl_clip_mode=${actor_kl_clip_mode}
  - hyperparameters.ent_start=${ent_start}
  - hyperparameters.vmin=${vmin}
  - hyperparameters.vmax=${vmax}
  - hyperparameters.num_bins=${num_bins}
  - hyperparameters.diffusion.learn_friction=${learn_friction}
  - hyperparameters.diffusion.learn_dt=${learn_dt}
  - hyperparameters.diffusion.per_step_dt=${per_step_dt}
  - hyperparameters.lr=${lr}
  - env=mjx_dmc
  - experiment_overrides=mjx_dmc_large_data
  - +wandb.project_suffix=${wandb_project_suffix}
  - num_trials=${n_trials}
