name: dime-reppo-acrobot-safe
method: grid

parameters:
  env_arg:
    values:
      - env.name=AcrobotSwingup
      - env.name=BallInCup
      - env.name=AcrobotSwingupSparse
      - env.name=PendulumSwingup
  num_eval_arg:
    values: [hyperparameters.num_eval=50]
  total_time_steps_arg:
    values: [hyperparameters.total_time_steps=50000000]
  diff_steps_arg:
    values: [hyperparameters.diffusion.diff_steps=8]
  kl_action_rep_arg:
    values: [hyperparameters.kl_action_rep=4]
  reverse_kl_arg:
    values: [hyperparameters.reverse_kl=false]
  actor_kl_clip_mode_arg:
    values: [hyperparameters.actor_kl_clip_mode=clipped]
  ent_start_arg:
    values: [hyperparameters.ent_start=0.01]
  vmin_arg:
    values: [hyperparameters.vmin=-30]
  vmax_arg:
    values: [hyperparameters.vmax=170]
  num_bins_arg:
    values: [hyperparameters.num_bins=201]
  learn_friction_arg:
    values: [hyperparameters.diffusion.learn_friction=true]
  learn_dt_arg:
    values: [hyperparameters.diffusion.learn_dt=true]
  per_step_dt_arg:
    values: [hyperparameters.diffusion.per_step_dt=true]
  lr_arg:
    values: [hyperparameters.lr=3e-4]
  env_config_arg:
    values: [env=mjx_dmc]
  exp_overrides_arg:
    values: [experiment_overrides=mjx_dmc_large_data]
  wandb_project_suffix_arg:
    values: [+wandb.project_suffix=_Final_reppo_DIME]
  n_trials_arg:
    values: [num_trials=3]

command:
  - python
  - -m
  - src.jaxrl.reppo_dime
  - ${env_arg}
  - ${num_eval_arg}
  - ${total_time_steps_arg}
  - ${diff_steps_arg}
  - ${kl_action_rep_arg}
  - ${reverse_kl_arg}
  - ${actor_kl_clip_mode_arg}
  - ${ent_start_arg}
  - ${vmin_arg}
  - ${vmax_arg}
  - ${num_bins_arg}
  - ${learn_friction_arg}
  - ${learn_dt_arg}
  - ${per_step_dt_arg}
  - ${lr_arg}
  - ${env_config_arg}
  - ${exp_overrides_arg}
  - ${wandb_project_suffix_arg}
  - ${n_trials_arg}
