# @package _global_
defaults:
- override /hydra/launcher: submitit_slurm

hydra:
  mode: MULTIRUN  # needed for launcher to be used
  launcher:
    # launcher/cluster specific options
    timeout_min: 2880  # 24 hours
    gres: gpu:1  # we want all GPUs in a node
    mem_per_cpu: 7500  # in MB (* 8 cores in use = 120GB)
    additional_parameters:
      cpus_per_task: 2
#    nodes: 1
    exclude: node[1]    # e.g. do not allocate on these nodes because the RTX2080 doesn't have enough VRAM
#    exclude:     # e.g. do not allocate on these nodes because the RTX2080 doesn't have enough VRAM
  job_logging:
    root:
      handlers: [file]
